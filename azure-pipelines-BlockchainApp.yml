trigger:
- main

pool:
  vmImage: 'windows-latest'

variables:
  buildConfiguration: 'Release'

steps:
- task: NuGetToolInstaller@1
- task: NuGetCommand@2
  displayName: Restore NuGet Packages
  inputs:
    command: 'restore'
    restoreSolution: 'BlockchainApp.sln'
- task: VSBuild@1
  displayName: Build & Publish Web App
  inputs:
    solution: 'BlockchainApp.sln'
    platform: 'Any CPU'
    configuration: '$(buildConfiguration)'
- task: CopyFiles@2
  displayName: Stage Web App
  inputs:
    SourceFolder: '$(Build.SourcesDirectory)\BlockchainApp'
    Contents: '**'
    TargetFolder: '$(Build.ArtifactStagingDirectory)'
- task: UseDotNet@2
  displayName: Install .NET SDK
  inputs:
    packageType: 'sdk'
    version: '5.0.x'
- task: DotNetCoreCLI@2
  displayName: Restore Console App
  inputs:
    command: restore
    projects: 'BlockchainConsole/BlockchainConsole.csproj'
- task: PowerShell@2
  displayName: "Publish Console App"
  inputs:
    targetType: inline
    script: |
      dotnet publish BlockchainConsole/BlockchainConsole.csproj `
        -c $(buildConfiguration) `
        -r win-x64 `
        --self-contained true `
        --output "$(Build.ArtifactStagingDirectory)\Tools"
- task: CopyFiles@2
  displayName: Copy Transactions File
  inputs:
    SourceFolder: '$(Build.SourcesDirectory)\BlockchainApp\Downloads'
    Contents: 'transactions.json'
    TargetFolder: '$(Build.ArtifactStagingDirectory)\Downloads'
- task: PublishPipelineArtifact@1
  displayName: Publish Artifact
  inputs:
    targetPath: '$(Build.ArtifactStagingDirectory)'
    artifactName: 'BlockchainApp'